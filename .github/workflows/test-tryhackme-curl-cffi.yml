name: Test TryHackMe curl_cffi

on:
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install curl_cffi
        run: python -m pip install --disable-pip-version-check curl_cffi

      - name: Test TryHackMe API from GitHub Actions
        env:
          THM_USERNAME: 0xKernal
        run: |
          python - <<'PY'
          import os
          from curl_cffi import requests

          username = os.environ["THM_USERNAME"]
          url = "https://tryhackme.com/api/v2/public-profile"

          try:
              response = requests.get(
                  url,
                  params={"username": username},
                  impersonate="chrome",
                  headers={"Accept": "application/json"},
                  timeout=25,
              )
          except Exception as exc:
              print(f"Request failed: {type(exc).__name__}: {exc}")
              raise

          print(f"HTTP Status: {response.status_code}")
          print(f"Content-Type: {response.headers.get('content-type')}")
          print(f"Vercel Mitigation: {response.headers.get('x-vercel-mitigated', 'None')}")

          if response.status_code != 200:
              print("Response preview:")
              print(response.text[:500])
              raise SystemExit("TryHackMe API request did not return HTTP 200")

          try:
              payload = response.json()
          except Exception as exc:
              print("Response was not valid JSON.")
              print(response.text[:500])
              raise SystemExit(1) from exc

          if payload.get("status") != "success" or not isinstance(payload.get("data"), dict):
              print("API returned an unexpected payload:")
              print(payload)
              raise SystemExit(1)

          profile = payload["data"]
          print(f"Username: {profile.get('username')}")
          print(f"Level: {profile.get('level')}")
          print(f"Points: {profile.get('totalPoints')}")
          print(f"Rooms: {profile.get('completedRoomsNumber')}")
          print("SUCCESS: GitHub Actions fetched the TryHackMe profile JSON.")
          PY
