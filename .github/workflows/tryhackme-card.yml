name: Update TryHackMe Card
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate SVG
        env:
          THM_USERNAME: 0xKernal
        run: python generate.py
      - name: Commit SVG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/tryhackme-card.svg
          git diff --cached --quiet || (git commit -m 'Update TryHackMe card' && git push)
