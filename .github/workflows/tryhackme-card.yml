name: Update TryHackMe Card

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write

# Avoid overlapping runs that both try to update main.
concurrency:
  group: tryhackme-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate SVG
        env:
          THM_USERNAME: 0xKernal
        run: python generate.py

      - name: Commit SVG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add assets/tryhackme-card.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update TryHackMe card"

          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase failed; stopping to avoid overwriting remote changes."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "TryHackMe card updated successfully."
              exit 0
            fi

            echo "Push attempt ${attempt} failed. Retrying..."
            sleep 2
          done

          echo "Failed to push after 3 attempts."
          exit 1
